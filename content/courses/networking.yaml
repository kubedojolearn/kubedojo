title: Networking
summary: Give Pods a stable address with Services, and work out why traffic isn't arriving.
description: |
  Pods come and go, and so do their IP addresses. **Services** give a group of Pods one stable address. You'll create Services, see how they find Pods through labels, and debug the most common reason a Service doesn't work.
