schemaVersion: 1
simulatorVersion: kubernetes-1.37-subset-1
description: A worker Deployment whose containers read QUEUE_NAME from a ConfigMap that doesn't exist yet.
imageCatalog:
  - image: kubedojo/worker:1.0
    behavior: run
    logs:
      - "worker 1.0 starting"
      - "connected to the job queue, waiting for work (simulated)"
resources:
  - apiVersion: v1
    kind: Node
    metadata:
      name: control-plane
      labels: { kubernetes.io/hostname: control-plane, node-role.kubernetes.io/control-plane: "" }
    spec:
      taints:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
    status:
      capacity: { cpu: "2", memory: 4Gi, pods: "110" }
      allocatable: { cpu: "1800m", memory: 3Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-1
      labels: { kubernetes.io/hostname: worker-1 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-2
      labels: { kubernetes.io/hostname: worker-2 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: worker, namespace: default, labels: { app: worker } }
    spec:
      replicas: 2
      selector: { matchLabels: { app: worker } }
      template:
        metadata: { labels: { app: worker } }
        spec:
          containers:
            - name: worker
              image: kubedojo/worker:1.0
              env:
                - name: QUEUE_NAME
                  valueFrom:
                    configMapKeyRef: { name: worker-config, key: QUEUE_NAME }
              resources: { requests: { cpu: 100m, memory: 64Mi } }
    ageSeconds: 900
