schemaVersion: 1
simulatorVersion: kubernetes-1.37-subset-1
description: A shop namespace with two Deployments and a standalone Pod, web-0, spread over two workers.
resources:
  - apiVersion: v1
    kind: Node
    metadata:
      name: control-plane
      labels: { kubernetes.io/hostname: control-plane, node-role.kubernetes.io/control-plane: "" }
    spec:
      taints:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
    status:
      capacity: { cpu: "2", memory: 4Gi, pods: "110" }
      allocatable: { cpu: "1800m", memory: 3Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-1
      labels: { kubernetes.io/hostname: worker-1 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-2
      labels: { kubernetes.io/hostname: worker-2 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Namespace
    metadata: { name: shop }
    ageSeconds: 864000
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: storefront, namespace: shop, labels: { app: storefront } }
    spec:
      replicas: 2
      selector: { matchLabels: { app: storefront } }
      template:
        metadata: { labels: { app: storefront } }
        spec:
          containers:
            - name: web
              image: nginx:1.27
              ports: [{ containerPort: 80 }]
              resources: { requests: { cpu: 250m, memory: 128Mi } }
    ageSeconds: 86400
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: cart, namespace: shop, labels: { app: cart } }
    spec:
      replicas: 1
      selector: { matchLabels: { app: cart } }
      template:
        metadata: { labels: { app: cart } }
        spec:
          containers:
            - name: cart
              image: redis:7
              resources: { requests: { cpu: 500m, memory: 256Mi } }
    ageSeconds: 43200
  - apiVersion: v1
    kind: Pod
    metadata: { name: web-0, namespace: shop, labels: { app: web } }
    spec:
      containers:
        - name: web
          image: httpd:2.4
          ports: [{ containerPort: 80 }]
          resources: { requests: { cpu: 300m, memory: 64Mi } }
    ageSeconds: 3600
  - apiVersion: v1
    kind: Pod
    metadata: { name: scratch, namespace: default, labels: { run: scratch } }
    spec:
      containers:
        - { name: scratch, image: "busybox:1.36", resources: { requests: { cpu: 50m, memory: 16Mi } } }
    ageSeconds: 1800
