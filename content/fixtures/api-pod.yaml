schemaVersion: 1
simulatorVersion: kubernetes-1.37-subset-1
description: Two worker nodes and one running Pod, api, whose logs report the port it listens on.
imageCatalog:
  - image: kubedojo/demo-api:1.0
    behavior: run
    logs:
      - "demo-api 1.0 starting"
      - "loaded configuration from environment"
      - "listening on 0.0.0.0:8080"
resources:
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-1
      labels: { kubernetes.io/hostname: worker-1 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 864000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-2
      labels: { kubernetes.io/hostname: worker-2 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 864000
  - apiVersion: v1
    kind: Pod
    metadata:
      name: api
      namespace: default
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: kubedojo/demo-api:1.0
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 100m, memory: 64Mi }
    ageSeconds: 1800
