schemaVersion: 1
simulatorVersion: kubernetes-1.37-subset-1
description: Three team namespaces with a few Pods each; billing-api lives in one of them.
resources:
  - apiVersion: v1
    kind: Node
    metadata:
      name: control-plane
      labels: { kubernetes.io/hostname: control-plane, node-role.kubernetes.io/control-plane: "" }
    spec:
      taints:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
    status:
      capacity: { cpu: "2", memory: 4Gi, pods: "110" }
      allocatable: { cpu: "1800m", memory: 3Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-1
      labels: { kubernetes.io/hostname: worker-1 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-2
      labels: { kubernetes.io/hostname: worker-2 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Namespace
    metadata: { name: team-a }
    ageSeconds: 864000
  - apiVersion: v1
    kind: Namespace
    metadata: { name: team-b }
    ageSeconds: 864000
  - apiVersion: v1
    kind: Namespace
    metadata: { name: payments }
    ageSeconds: 864000
  - apiVersion: v1
    kind: Pod
    metadata: { name: web, namespace: team-a, labels: { app: web } }
    spec:
      containers:
        - { name: web, image: "nginx:1.27", resources: { requests: { cpu: 100m, memory: 64Mi } } }
    ageSeconds: 7200
  - apiVersion: v1
    kind: Pod
    metadata: { name: cache, namespace: team-a, labels: { app: cache } }
    spec:
      containers:
        - { name: redis, image: "redis:7", resources: { requests: { cpu: 100m, memory: 128Mi } } }
    ageSeconds: 7200
  - apiVersion: v1
    kind: Pod
    metadata: { name: reports, namespace: team-b, labels: { app: reports } }
    spec:
      containers:
        - { name: reports, image: "httpd:2.4", resources: { requests: { cpu: 100m, memory: 64Mi } } }
    ageSeconds: 5400
  - apiVersion: v1
    kind: Pod
    metadata: { name: billing-api, namespace: payments, labels: { app: billing-api } }
    spec:
      containers:
        - name: api
          image: kubedojo/demo-api:1.0
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 100m, memory: 64Mi } }
    ageSeconds: 3600
