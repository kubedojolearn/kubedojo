schemaVersion: 1
simulatorVersion: kubernetes-1.37-subset-1
description: An orders Deployment whose container exits at start-up because APP_MODE isn't set.
imageCatalog:
  - image: kubedojo/orders:1.0
    behavior: crash
    exitCode: 1
    requiresEnv: [APP_MODE]
    logs:
      - "orders 1.0 starting"
      - "reading configuration from environment"
      - "fatal: APP_MODE is not set; expected one of: production, staging"
resources:
  - apiVersion: v1
    kind: Node
    metadata:
      name: control-plane
      labels: { kubernetes.io/hostname: control-plane, node-role.kubernetes.io/control-plane: "" }
    spec:
      taints:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
    status:
      capacity: { cpu: "2", memory: 4Gi, pods: "110" }
      allocatable: { cpu: "1800m", memory: 3Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-1
      labels: { kubernetes.io/hostname: worker-1 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-2
      labels: { kubernetes.io/hostname: worker-2 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: orders, namespace: default, labels: { app: orders } }
    spec:
      replicas: 1
      selector: { matchLabels: { app: orders } }
      template:
        metadata: { labels: { app: orders } }
        spec:
          containers:
            - name: orders
              image: kubedojo/orders:1.0
              ports: [{ containerPort: 8080 }]
              resources: { requests: { cpu: 100m, memory: 64Mi } }
    ageSeconds: 1800
