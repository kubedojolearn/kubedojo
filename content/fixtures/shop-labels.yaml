schemaVersion: 1
simulatorVersion: kubernetes-1.37-subset-1
description: Six labelled Pods from two apps; cart is missing its tier label.
resources:
  - apiVersion: v1
    kind: Node
    metadata:
      name: control-plane
      labels: { kubernetes.io/hostname: control-plane, node-role.kubernetes.io/control-plane: "" }
    spec:
      taints:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
    status:
      capacity: { cpu: "2", memory: 4Gi, pods: "110" }
      allocatable: { cpu: "1800m", memory: 3Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-1
      labels: { kubernetes.io/hostname: worker-1 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-2
      labels: { kubernetes.io/hostname: worker-2 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Pod
    metadata: { name: storefront-1, namespace: default, labels: { app: shop, tier: frontend } }
    spec:
      containers:
        - { name: app, image: "nginx:1.27", resources: { requests: { cpu: 100m, memory: 64Mi } } }
    ageSeconds: 7200
  - apiVersion: v1
    kind: Pod
    metadata: { name: storefront-2, namespace: default, labels: { app: shop, tier: frontend } }
    spec:
      containers:
        - { name: app, image: "nginx:1.27", resources: { requests: { cpu: 100m, memory: 64Mi } } }
    ageSeconds: 7200
  - apiVersion: v1
    kind: Pod
    metadata: { name: cart, namespace: default, labels: { app: shop } }
    spec:
      containers:
        - { name: app, image: "kubedojo/demo-api:1.0", resources: { requests: { cpu: 100m, memory: 64Mi } } }
    ageSeconds: 5400
  - apiVersion: v1
    kind: Pod
    metadata: { name: checkout, namespace: default, labels: { app: shop, tier: backend } }
    spec:
      containers:
        - { name: app, image: "kubedojo/demo-api:1.0", resources: { requests: { cpu: 100m, memory: 64Mi } } }
    ageSeconds: 5400
  - apiVersion: v1
    kind: Pod
    metadata: { name: cache, namespace: default, labels: { app: shop, tier: cache } }
    spec:
      containers:
        - { name: app, image: "redis:7", resources: { requests: { cpu: 100m, memory: 64Mi } } }
    ageSeconds: 5400
  - apiVersion: v1
    kind: Pod
    metadata: { name: admin-ui, namespace: default, labels: { app: admin, tier: frontend } }
    spec:
      containers:
        - { name: app, image: "httpd:2.4", resources: { requests: { cpu: 100m, memory: 64Mi } } }
    ageSeconds: 3600
