schemaVersion: 1
simulatorVersion: kubernetes-1.37-subset-1
description: An api Service selecting app=api,tier=backend; one of its three Pods is missing the tier label.
resources:
  - apiVersion: v1
    kind: Node
    metadata:
      name: control-plane
      labels: { kubernetes.io/hostname: control-plane, node-role.kubernetes.io/control-plane: "" }
    spec:
      taints:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
    status:
      capacity: { cpu: "2", memory: 4Gi, pods: "110" }
      allocatable: { cpu: "1800m", memory: 3Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-1
      labels: { kubernetes.io/hostname: worker-1 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-2
      labels: { kubernetes.io/hostname: worker-2 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Pod
    metadata: { name: api-1, namespace: default, labels: { app: api, tier: backend } }
    spec:
      containers:
        - { name: app, image: "kubedojo/demo-api:1.0", resources: { requests: { cpu: 100m, memory: 64Mi } } }
    ageSeconds: 7200
  - apiVersion: v1
    kind: Pod
    metadata: { name: api-2, namespace: default, labels: { app: api, tier: backend } }
    spec:
      containers:
        - { name: app, image: "kubedojo/demo-api:1.0", resources: { requests: { cpu: 100m, memory: 64Mi } } }
    ageSeconds: 7200
  - apiVersion: v1
    kind: Pod
    metadata: { name: api-3, namespace: default, labels: { app: api } }
    spec:
      containers:
        - { name: app, image: "kubedojo/demo-api:1.0", resources: { requests: { cpu: 100m, memory: 64Mi } } }
    ageSeconds: 3600
  - apiVersion: v1
    kind: Service
    metadata: { name: api, namespace: default, labels: { app: api } }
    spec:
      selector: { app: api, tier: backend }
      ports:
        - { name: http, port: 80, targetPort: 8080 }
    ageSeconds: 7000
