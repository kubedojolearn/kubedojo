schemaVersion: 1
simulatorVersion: kubernetes-1.37-subset-1
description: A search Deployment still labelled env=staging after being promoted to production.
resources:
  - apiVersion: v1
    kind: Node
    metadata:
      name: control-plane
      labels: { kubernetes.io/hostname: control-plane, node-role.kubernetes.io/control-plane: "" }
    spec:
      taints:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
    status:
      capacity: { cpu: "2", memory: 4Gi, pods: "110" }
      allocatable: { cpu: "1800m", memory: 3Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-1
      labels: { kubernetes.io/hostname: worker-1 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-2
      labels: { kubernetes.io/hostname: worker-2 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: search, namespace: default, labels: { app: search, env: staging } }
    spec:
      replicas: 2
      selector: { matchLabels: { app: search } }
      template:
        metadata: { labels: { app: search } }
        spec:
          containers:
            - name: search
              image: kubedojo/demo-api:1.0
              ports: [{ containerPort: 8080 }]
              resources: { requests: { cpu: 100m, memory: 64Mi } }
    ageSeconds: 86400
