schemaVersion: 1
simulatorVersion: kubernetes-1.37-subset-1
description: One control-plane node, two workers, and the control-plane Pods in kube-system.
imageCatalog:
  - image: registry.k8s.io/kube-apiserver:v1.37.1
    behavior: run
    logs: ["Serving securely on [::]:6443 (simulated)"]
  - image: registry.k8s.io/etcd:3.6.5-0
    behavior: run
    logs: ["ready to serve client requests (simulated)"]
  - image: registry.k8s.io/kube-scheduler:v1.37.1
    behavior: run
    logs: ["Starting Kubernetes Scheduler (simulated)"]
  - image: registry.k8s.io/kube-controller-manager:v1.37.1
    behavior: run
    logs: ["Started controllers (simulated)"]
resources:
  - apiVersion: v1
    kind: Node
    metadata:
      name: control-plane
      labels: { kubernetes.io/hostname: control-plane, node-role.kubernetes.io/control-plane: "" }
    spec:
      taints:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
    status:
      capacity: { cpu: "2", memory: 4Gi, pods: "110" }
      allocatable: { cpu: "1800m", memory: 3Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-1
      labels: { kubernetes.io/hostname: worker-1 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-2
      labels: { kubernetes.io/hostname: worker-2 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
  - apiVersion: v1
    kind: Pod
    metadata:
      name: kube-apiserver-control-plane
      namespace: kube-system
      labels: { component: kube-apiserver, tier: control-plane }
    spec:
      nodeName: control-plane
      tolerations:
        - { operator: Exists }
      containers:
        - { name: kube-apiserver, image: "registry.k8s.io/kube-apiserver:v1.37.1" }
  - apiVersion: v1
    kind: Pod
    metadata:
      name: etcd-control-plane
      namespace: kube-system
      labels: { component: etcd, tier: control-plane }
    spec:
      nodeName: control-plane
      tolerations:
        - { operator: Exists }
      containers:
        - { name: etcd, image: "registry.k8s.io/etcd:3.6.5-0" }
  - apiVersion: v1
    kind: Pod
    metadata:
      name: kube-scheduler-control-plane
      namespace: kube-system
      labels: { component: kube-scheduler, tier: control-plane }
    spec:
      nodeName: control-plane
      tolerations:
        - { operator: Exists }
      containers:
        - { name: kube-scheduler, image: "registry.k8s.io/kube-scheduler:v1.37.1" }
  - apiVersion: v1
    kind: Pod
    metadata:
      name: kube-controller-manager-control-plane
      namespace: kube-system
      labels: { component: kube-controller-manager, tier: control-plane }
    spec:
      nodeName: control-plane
      tolerations:
        - { operator: Exists }
      containers:
        - { name: kube-controller-manager, image: "registry.k8s.io/kube-controller-manager:v1.37.1" }
