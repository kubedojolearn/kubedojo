schemaVersion: 1
simulatorVersion: kubernetes-1.37-subset-1
description: A batch Deployment whose Pods each request 2 CPUs, so only two of three fit on the workers.
resources:
  - apiVersion: v1
    kind: Node
    metadata:
      name: control-plane
      labels: { kubernetes.io/hostname: control-plane, node-role.kubernetes.io/control-plane: "" }
    spec:
      taints:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
    status:
      capacity: { cpu: "2", memory: 4Gi, pods: "110" }
      allocatable: { cpu: "1800m", memory: 3Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-1
      labels: { kubernetes.io/hostname: worker-1 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: v1
    kind: Node
    metadata:
      name: worker-2
      labels: { kubernetes.io/hostname: worker-2 }
    status:
      capacity: { cpu: "4", memory: 8Gi, pods: "110" }
      allocatable: { cpu: "3800m", memory: 7Gi, pods: "110" }
      conditions:
        - { type: Ready, status: "True" }
    ageSeconds: 2592000
  - apiVersion: apps/v1
    kind: Deployment
    metadata: { name: batch, namespace: default, labels: { app: batch } }
    spec:
      replicas: 3
      selector: { matchLabels: { app: batch } }
      template:
        metadata: { labels: { app: batch } }
        spec:
          containers:
            - name: batch
              image: busybox:1.36
              resources:
                requests: { cpu: "2", memory: 256Mi }
                limits: { cpu: "2", memory: 256Mi }
    ageSeconds: 1200
