goals:
  - id: reports-ready
    type: state
    description: Both reports Pods are scheduled and ready.
    failureMessage: Check `kubectl get pods` and the newest FailedScheduling event. Which label does the Pod ask for, and which node should have it?
    target: { kind: Deployment, namespace: default, name: reports }
    assertions:
      - { path: status.readyReplicas, operator: equals, value: 2 }
hints:
  - Describe one of the Pending Pods and read its Events.
  - "Compare the Pod's Node-Selectors line with `kubectl get nodes --show-labels`."
  - "Try: kubectl label node worker-1 disk=ssd"
solution:
  commands:
    - kubectl describe pod -l app=reports
    - kubectl label node worker-1 disk=ssd
