initialFixture: fixtures/secrets-demo.yaml
terminal:
  allowedFamilies: [get, describe, create, delete, events, explain]
goals:
  - id: db-creds
    type: state
    description: An Opaque Secret called db-creds has a username key.
    failureMessage: Check `kubectl describe secret db-creds`. Is there a username key, and is the type Opaque?
    target: { kind: Secret, namespace: default, name: db-creds }
    assertions:
      - { path: type, operator: equals, value: Opaque }
      - { path: data.username, operator: exists }
  - id: demo-token-value
    type: answer
    description: Decode the dummy value in the demo-token Secret.
    prompt: What value does the `token` key of the Secret `demo-token` hold, once decoded?
    input: choice
    choices: [letmein, s3cr3t-dojo, kubedojo-admin, changeme-please]
    failureMessage: "`kubectl describe secret demo-token` shows the value's size in bytes. Which option has that many characters?"
    expected:
      static: s3cr3t-dojo
hints:
  - "`kubectl create secret generic <name> --from-literal=key=value` creates an Opaque Secret."
  - "`kubectl get secret demo-token -o yaml` shows the base64-encoded value under data."
  - The describe output says how many bytes the value has. Count the characters in each option.
solution:
  commands:
    - kubectl create secret generic db-creds --from-literal=username=trainee --from-literal=password=not-a-real-password
    - kubectl describe secret demo-token
  answers:
    demo-token-value: s3cr3t-dojo
