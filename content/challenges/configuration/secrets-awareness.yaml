schemaVersion: 1
id: configuration/secrets-awareness
version: 1
course: configuration
lesson: secrets-awareness
title: Secrets are not encryption
summary: Create a Secret, see that its values are only base64-encoded, and learn what actually keeps them safe.
simulatorVersion: kubernetes-1.37-subset-1
estimatedMinutes: 12
lastReviewed: 2026-10-25
objectives:
  - Create an Opaque Secret from literal values
  - Explain that base64 is an encoding anyone can reverse, not encryption
  - Name the controls that actually protect Secrets in a real cluster
prerequisites:
  - configuration/environment-from-configmaps
glossary: [secret, configmap, pod]
body: |
  A **Secret** looks a lot like a ConfigMap: named key-value pairs that Pods can read as environment
  variables or files. The difference is intent. Secrets are for passwords, tokens and keys, and
  Kubernetes treats them a little more carefully. A little.

  ## Create one

  ```sh
  kubectl create secret generic db-creds --from-literal=username=trainee --from-literal=password=not-a-real-password
  ```

  `generic` makes an `Opaque` Secret, the plain key-value kind.

  > **Never paste a real credential into this lab or any training environment.** Use made-up values.

  ## Look closely

  ```sh
  kubectl describe secret db-creds
  kubectl get secret db-creds -o yaml
  ```

  `describe` politely shows only sizes, like `password: 19 bytes`. But `-o yaml` shows the values
  under `data`, **base64-encoded**. Base64 is a way of writing bytes as text, not a cipher. There's
  no key, and anyone who can read the Secret can turn it back into the original value in a second.

  ## What actually protects Secrets

  On a real cluster, the safety comes from settings around them:

  - **RBAC**: only let the people and workloads that need a Secret read it. Permission to *list*
    Secrets in a namespace is permission to read them all.
  - **Encryption at rest**: configure the API server to encrypt Secrets before storing them in etcd.
    Otherwise they sit there as base64.
  - **Keep them out of Git**: a Secret manifest in a repository is the same as the password in the
    repository. Teams use tools that encrypt manifests or pull values from an external secret store.

  ## Your task

  1. Create an Opaque Secret called `db-creds` with a `username` key (and a made-up password if you
     like).
  2. The training Secret `demo-token` holds a dummy value. Read it with `-o yaml` and work out what
     it says.

  The lab terminal only runs kubectl. Decode the value with any base64 tool on your own computer, or
  compare the byte size that `describe` shows with the options.

  > **Simulated cluster:** only `Opaque` Secrets are simulated, and Secret values are left out of
  > command history and logs.
