schemaVersion: 1
id: cluster-operations/events-and-diagnostics
version: 1
course: cluster-operations
lesson: events-and-diagnostics
title: Read events like a detective
summary: Use the cluster's event log to reconstruct what happened, and pick out the warning that explains a problem.
simulatorVersion: kubernetes-1.37-subset-1
estimatedMinutes: 10
lastReviewed: 2026-10-25
objectives:
  - List events for a namespace or a single object
  - Tell Normal events from Warnings and read an event's reason and message
  - Follow a chain of events from a Deployment down to its Pods
prerequisites:
  - cluster-operations/requests-limits-scheduling
glossary: [event, pod, deployment, replicaset, scheduler]
body: |
  Controllers, the scheduler and the kubelet record what they do as **events**. Together they're a
  timeline of the namespace: who created what, where it was scheduled, which image was pulled, and
  what went wrong.

  ## The whole timeline

  ```sh
  kubectl get events
  ```

  Each row has a `TYPE`, a `REASON`, the `OBJECT` it's about, and a `MESSAGE`. Healthy activity is
  `Normal`. Read a Deployment's chain from top to bottom:

  1. `ScalingReplicaSet` on the Deployment: "scale the ReplicaSet up to 2".
  2. `SuccessfulCreate` on the ReplicaSet: "created a Pod".
  3. `Scheduled` on the Pod: "assigned to worker-1".
  4. `Pulled`, `Created`, `Started` on the Pod: the kubelet started the container.

  ## Find the warnings

  Problems are `Warning` events. The newer `kubectl events` command can filter them and focus on
  one object:

  ```sh
  kubectl events --types Warning
  kubectl events --for pod/etl
  ```

  The same events appear at the bottom of `kubectl describe`, which is usually where you meet them
  first.

  Common Warning reasons:

  | Reason | Usually means |
  | --- | --- |
  | `FailedScheduling` | No node can take the Pod. The message gives a tally of why. |
  | `Failed` | Pulling the image or configuring the container failed. |
  | `BackOff` | A container keeps crashing, or an image keeps failing to pull, so the kubelet waits before retrying. |

  ## Events don't last

  A cluster keeps events for a limited time, typically one hour. Investigate soon, and don't use
  events as an audit log.

  ## Your task

  The `etl` Pod has been waiting for ten minutes. Use `kubectl events` to find the warning about
  `etl`, and identify its reason.

  > **Simulated cluster:** events are generated by the simulator with the same reasons and message
  > formats as a real cluster. They're kept per lab rather than expiring after an hour.
references:
  - title: Event (Kubernetes API reference)
    url: https://kubernetes.io/docs/reference/kubernetes-api/cluster-resources/event-v1/
  - title: kubectl events (Kubernetes docs)
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_events/
initialFixture: fixtures/etl-events.yaml
terminal:
  allowedFamilies: [get, describe, events, logs, explain]
goals:
  - id: listed-events
    type: observation
    description: Filter the namespace's events with kubectl events.
    failureMessage: "Run `kubectl events`, for example with `--types Warning`."
    command: { verb: events }
  - id: etl-reason
    type: answer
    description: Identify the reason on the etl Pod's warning.
    prompt: What is the reason of the Warning event for the Pod `etl`?
    input: choice
    choices: [BackOff, FailedScheduling, Killing, Pulled]
    failureMessage: Look at the REASON column of the Warning row whose OBJECT is pod/etl.
    expected:
      static: FailedScheduling
hints:
  - "`kubectl get events` lists everything that happened in the namespace."
  - Warnings are rare in a healthy namespace; look at the TYPE column.
  - "`kubectl events --for pod/etl` shows only the etl Pod's events."
solution:
  commands:
    - kubectl get events
    - kubectl events --for pod/etl
  answers:
    etl-reason: FailedScheduling
reward:
  baseXP: 75
  firstTryBonusXP: 15
  hintPenaltyPerHintXP: 5
