initialFixture: fixtures/search-deployment.yaml
terminal:
  allowedFamilies: [get, describe, label, annotate, events, explain]
goals:
  - id: search-metadata
    type: state
    description: The search Deployment is labelled env=prod and annotated owner=platform-team.
    failureMessage: Check `kubectl describe deployment search`. Labels and Annotations are listed separately near the top.
    target: { kind: Deployment, namespace: default, name: search }
    assertions:
      - { path: metadata.labels.env, operator: equals, value: prod }
      - { path: metadata.labels.app, operator: equals, value: search }
      - { path: metadata.annotations.owner, operator: equals, value: platform-team }
hints:
  - The env label already exists, so kubectl needs permission to change it.
  - "Try: kubectl label deployment search env=prod --overwrite"
  - "`kubectl annotate deployment search owner=platform-team` adds the annotation."
solution:
  commands:
    - kubectl label deployment search env=prod --overwrite
    - kubectl annotate deployment search owner=platform-team
