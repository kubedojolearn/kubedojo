initialFixture: fixtures/empty-cluster.yaml
terminal:
  allowedFamilies: [get, describe, create, delete, events, explain, api-resources]
goals:
  - id: staging-namespace
    type: state
    description: A namespace called staging exists and is active.
    failureMessage: Check `kubectl get namespaces`. The name must be exactly staging.
    target: { kind: Namespace, name: staging }
    assertions:
      - { path: status.phase, operator: equals, value: Active }
  - id: node-scope
    type: answer
    description: Decide whether Nodes belong to a namespace.
    prompt: Is a Node a namespaced object?
    input: choice
    choices: ["Yes, every Node belongs to a namespace", "No, Nodes are cluster-scoped"]
    failureMessage: Check the NAMESPACED column of `kubectl api-resources`.
    expected:
      static: "No, Nodes are cluster-scoped"
hints:
  - "`kubectl create namespace <name>` creates one."
  - "`kubectl api-resources --namespaced=false` lists the cluster-scoped kinds."
solution:
  commands:
    - kubectl create namespace staging
    - kubectl api-resources --namespaced=false
  answers:
    node-scope: "No, Nodes are cluster-scoped"
