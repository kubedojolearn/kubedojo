initialFixture: fixtures/team-namespaces.yaml
terminal:
  allowedFamilies: [get, describe, logs, events, explain, config, api-resources]
goals:
  - id: default-namespace
    type: observation
    description: Make team-a your current namespace.
    failureMessage: Use `kubectl config set-context` with `--current` and `--namespace`.
    command: { verb: config, subverb: set-context, setsNamespace: team-a }
  - id: billing-namespace
    type: answer
    description: Find the namespace the billing-api Pod runs in.
    prompt: Which namespace is the Pod `billing-api` in?
    input: text
    caseSensitive: false
    failureMessage: Search every namespace at once with `kubectl get pods -A`.
    expected:
      path:
        target: { kind: Pod, namespace: payments, name: billing-api }
        path: metadata.namespace
hints:
  - "`kubectl get namespaces` lists them all; `kubectl get pods -n <name>` looks inside one."
  - "`-A` searches every namespace at once and adds a NAMESPACE column."
  - "Try: kubectl config set-context --current --namespace=team-a"
solution:
  commands:
    - kubectl config set-context --current --namespace=team-a
    - kubectl get pods -A
