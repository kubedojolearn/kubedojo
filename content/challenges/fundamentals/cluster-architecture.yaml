initialFixture: fixtures/three-node-cluster.yaml
terminal:
  allowedFamilies: [get, describe, explain, api-resources, cluster-info, version, config, logs, events]
goals:
  - id: node-count
    type: answer
    description: Count the nodes in this cluster.
    prompt: How many nodes does this cluster have?
    input: number
    failureMessage: Not quite. Run `kubectl get nodes` and count the rows.
    expected:
      count: { kind: Node }
  - id: state-store
    type: answer
    description: Identify where the cluster stores its state.
    prompt: Which control-plane component stores the cluster's state?
    input: choice
    choices: [kube-apiserver, etcd, kube-scheduler, kube-controller-manager]
    failureMessage: Look back at the table in the lesson. Which component is a database?
    expected:
      static: etcd
hints:
  - "`kubectl get nodes` lists every node in the cluster."
  - "`kubectl get pods -n kube-system` shows the control-plane components running as Pods."
solution:
  commands:
    - kubectl get nodes
    - kubectl get pods -n kube-system
  answers:
    node-count: "3"
    state-store: etcd
