name: Release

# Weekly release: publishes the newest commit on main that passed CI as multi-platform images
# (ghcr.io/kubedojolearn/kubedojo-api and -web), tagged latest, the release date and the commit,
# the Helm chart (oci://ghcr.io/kubedojolearn/charts/kubedojo), and a GitHub release carrying the
# self-host files. Self-hosters update with
# `docker compose pull && docker compose up -d` (docs/operations/self-host.md).
#
# Nothing is built or published until a required reviewer of the `release` environment approves
# the run (Settings -> Environments -> release).
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Release even if nothing changed since the last release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/kubedojolearn/kubedojo

jobs:
  prepare:
    name: Pick the commit to release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.pick.outputs.release }}
      sha: ${{ steps.pick.outputs.sha }}
      short: ${{ steps.pick.outputs.short }}
      version: ${{ steps.pick.outputs.version }}
      chart-version: ${{ steps.pick.outputs.chart-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          # The newest push to main whose full CI run succeeded; never an untested commit.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
            -q '.workflow_runs[0].head_sha // empty')
          if [ -z "$sha" ]; then
            echo "::error::No successful CI run on main; nothing to release."
            exit 1
          fi
          last=$(git describe --tags --abbrev=0 --match 'release-*' "$sha" 2>/dev/null || true)
          if [ -n "$last" ] && [ "$(git rev-list -n 1 "$last")" = "$sha" ] && [ "$FORCE" != "true" ]; then
            echo "::notice::$last already contains $sha; skipping this week's release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(date -u +%Y-%m-%d)
          # Helm needs SemVer: YYYY.MMDD.N, where N is 0, or the time for a same-day re-release.
          chart_version="$(date -u +%Y).$((10#$(date -u +%m) * 100 + 10#$(date -u +%d)))"
          if git rev-parse -q --verify "refs/tags/release-$version" >/dev/null; then
            version="$version.$(date -u +%H%M)" # a second release on the same day
            chart_version="$chart_version.$((10#$(date -u +%H%M) + 1))"
          else
            chart_version="$chart_version.0"
          fi
          {
            echo "release=true"
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "version=$version"
            echo "chart-version=$chart_version"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing $sha as $version"

  approve:
    name: Approve release
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    # Pauses the run until a required reviewer of this environment approves it. Only the
    # jobs after this one publish anything.
    environment: release
    steps:
      - env:
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "::notice::Approved release of $SHA as $VERSION"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: [prepare, approve]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [api, web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: api
            context: apps/api
            file: apps/api/Dockerfile
            build-contexts: content=content
          - image: web
            context: .
            file: apps/web/Dockerfile
            build-contexts: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.build-contexts }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          # Pushed by digest only; the merge job below tags the multi-platform index.
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Tag ${{ matrix.image }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create the multi-platform image and its tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          IMAGE_NAME: ${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHORT: ${{ needs.prepare.outputs.short }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          # Index annotations link the package to this repository on GHCR.
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.description=KubeDojo $IMAGE_NAME image ($VERSION)" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            -t "$IMAGE:latest" -t "$IMAGE:$VERSION" -t "$IMAGE:sha-$SHORT" \
            "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  chart:
    name: Publish Helm chart
    needs: [prepare, merge]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Package the chart for this release's images and push it
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHART_VERSION: ${{ needs.prepare.outputs.chart-version }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          # appVersion is the image tag, so the chart deploys exactly this release's images.
          helm package deploy/helm/kubedojo --version "$CHART_VERSION" --app-version "$VERSION" -d "$RUNNER_TEMP/chart"
          helm push "$RUNNER_TEMP/chart/kubedojo-$CHART_VERSION.tgz" oci://ghcr.io/kubedojolearn/charts

  release:
    name: GitHub release
    needs: [prepare, merge, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Tag and publish the release with the self-host files
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHART_VERSION: ${{ needs.prepare.outputs.chart-version }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          # Release assets can't start with a dot; docs/operations/self-host.md saves it as .env.example.
          cp deploy/selfhost/.env.example "$RUNNER_TEMP/env.example"
          notes=$(cat <<EOF
          Images: \`$IMAGE_PREFIX-api:$VERSION\` and \`$IMAGE_PREFIX-web:$VERSION\` (also tagged \`latest\`).

          Update a self-hosted stack: \`docker compose pull && docker compose up -d\`. Migrations and lessons apply on start.
          New install: [docs/operations/self-host.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/release-$VERSION/docs/operations/self-host.md).

          Helm chart \`$CHART_VERSION\`: \`helm upgrade --install kubedojo oci://ghcr.io/kubedojolearn/charts/kubedojo --version $CHART_VERSION\` ([chart README]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/release-$VERSION/deploy/helm/kubedojo/README.md)).
          EOF
          )
          gh release create "release-$VERSION" \
            --target "$SHA" \
            --title "KubeDojo $VERSION" \
            --notes "$notes" \
            --generate-notes \
            --latest \
            deploy/selfhost/compose.yaml \
            "$RUNNER_TEMP/env.example" \
            scripts/gen-env.mjs
