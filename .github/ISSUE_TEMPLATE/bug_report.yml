name: Bug report
description: Something in KubeDojo does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: please do **not** open an issue. Follow [SECURITY.md](../security/policy).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command or steps, and what you expected instead.
    validations: { required: true }
  - type: input
    id: lesson
    attributes:
      label: Lesson (if any)
      placeholder: workloads/scaling-deployments
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Browser and OS, or for local development the output of `node -v`, `go version`, `docker version`.
