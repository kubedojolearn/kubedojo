{{- $fullname := include "kubedojo.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "kubedojo.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "kubedojo.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubedojo.labels" (dict "ctx" $ "component" "api") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "kubedojo.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      {{- include "kubedojo.scheduling" . | nindent 6 }}
      initContainers:
        # Applies migrations, seeds reference data and imports the lessons built into the image.
        # Idempotent, and serialized across pods by a database lock.
        - name: bootstrap
          image: {{ include "kubedojo.image" (dict "ctx" $ "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["bootstrap", "-content", "/content"]
          env:
            {{- include "kubedojo.backendEnv" . | nindent 12 }}
          securityContext:
            {{- include "kubedojo.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      containers:
        - name: api
          image: {{ include "kubedojo.image" (dict "ctx" $ "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          env:
            {{- include "kubedojo.backendEnv" . | nindent 12 }}
            - name: API_LISTEN_ADDR
              value: ":8080"
            # Lab terminals connect over a WebSocket from the public origin.
            - name: WS_ALLOWED_ORIGINS
              value: {{ .Values.webOrigin | quote }}
            {{- include "kubedojo.secretEnv" (dict "ctx" . "key" "API_JWT_PUBLIC_KEYS") | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /api/v1/healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/v1/readyz, port: http }
            periodSeconds: 5
          securityContext:
            {{- include "kubedojo.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
# Reached by the web app's BFF and, through the Ingress, only at /api/v1/ws (ADR-0003).
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "kubedojo.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "kubedojo.selectorLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
