{{- if .Values.redis.enabled }}
{{- $fullname := include "kubedojo.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "kubedojo.labels" (dict "ctx" $ "component" "redis") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubedojo.selectorLabels" (dict "ctx" $ "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubedojo.labels" (dict "ctx" $ "component" "redis") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- include "kubedojo.scheduling" . | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Redis holds only disposable coordination data (ADR-0004): no persistence.
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 15
          securityContext:
            # The image starts as root and drops to the redis user.
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "kubedojo.labels" (dict "ctx" $ "component" "redis") | nindent 4 }}
spec:
  selector:
    {{- include "kubedojo.selectorLabels" (dict "ctx" $ "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
