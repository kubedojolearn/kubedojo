{{- if .Values.postgresql.enabled }}
{{- $fullname := include "kubedojo.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgresql
  labels:
    {{- include "kubedojo.labels" (dict "ctx" $ "component" "postgresql") | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubedojo.selectorLabels" (dict "ctx" $ "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubedojo.labels" (dict "ctx" $ "component" "postgresql") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- include "kubedojo.scheduling" . | nindent 6 }}
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            {{- include "kubedojo.secretEnv" (dict "ctx" . "key" "POSTGRES_PASSWORD") | nindent 12 }}
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            # The image starts as root to prepare the data directory, then drops to postgres.
            allowPrivilegeEscalation: false
          volumeMounts:
            # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/docker.
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgresql
  labels:
    {{- include "kubedojo.labels" (dict "ctx" $ "component" "postgresql") | nindent 4 }}
spec:
  selector:
    {{- include "kubedojo.selectorLabels" (dict "ctx" $ "component" "postgresql") | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
{{- end }}
