# sqlc generates db/generated from db/queries against the goose migrations.
# Regenerate with `make sqlc`; CI fails if the output is stale.
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    strict_function_checks: true
    gen:
      go:
        package: dbgen
        out: db/generated
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_result_struct_pointers: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
